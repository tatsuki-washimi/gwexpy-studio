name: Diagnose NORMAL trial gate

on:
  push:
    branches:
      - diag/trial-gate-observations

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-trial-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 1f5ad0a1bb4085bfc37e58c13c045517a5ea4c0f
  DEBIAN_ARTIFACT_ID: "10307669602"
  DEBIAN_ARTIFACT_DIGEST: sha256:a5729608adc8140864fd9a0fe7db7724a5905d567a8eef0c60120e7c2b0b1540
  DEBIAN_WHEEL_SHA: 57770f572565c56ee1d0f155cc6e7f5ca614504ae29cbf8f2f1d1e0aabb3d55f
  MAC_ARTIFACT_ID: "10307894182"
  MAC_ARTIFACT_DIGEST: sha256:96b97d5aac698891cac18c3c9ea29849ac84582879e5ac391212978a2d55b417
  MAC_WHEEL_SHA: 9c4f7d35bacb494041789268ae2438e8901013b049202bac9a5cf02dc9e98c23
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnose-macos:
    name: Observe Cocoa NORMAL gate
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact original P separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          path: original-p

      - name: Bind source and diagnostic hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-p rev-parse --verify HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C original-p status --porcelain=v1 --untracked-files=all)"
          test "$(uname -m)" = arm64
          branch_sha="$(git rev-parse --verify HEAD)"
          gate_sha="$(python3.12 - original-p/scripts/run_trial_technical_gate.py <<'PY'
          import hashlib
          import sys
          print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())
          PY
          )"
          echo "BRANCH_SHA=$branch_sha" >> "$GITHUB_ENV"
          echo "ORIGINAL_GATE_SHA=$gate_sha" >> "$GITHUB_ENV"

      - name: Initialize upload-safe snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-output"
          python3.12 scripts/diagnose_trial_gate.py \
            --init \
            --branch-sha "$BRANCH_SHA" \
            --original-gate-sha "$ORIGINAL_GATE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --wheel-sha "$MAC_WHEEL_SHA" \
            --original-checkout "$GITHUB_WORKSPACE/original-p" \
            --original-gate "$GITHUB_WORKSPACE/original-p/scripts/run_trial_technical_gate.py" \
            --work-root "$RUNNER_TEMP/gate-work" \
            --snapshot "$RUNNER_TEMP/diagnostic-output/diagnostic-snapshot.json"

      - name: Download exact Mac seed by artifact ID
        id: seed
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MAC_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/mac-seed.zip"
          actual="$(python3.12 - "$RUNNER_TEMP/mac-seed.zip" <<'PY'
          import hashlib
          import sys
          digest = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          print("sha256:" + digest.hexdigest())
          PY
          )"
          test "$actual" = "$MAC_ARTIFACT_DIGEST"
          python3.12 original-p/scripts/extract_trial_artifact.py \
            --archive "$RUNNER_TEMP/mac-seed.zip" \
            --output "$RUNNER_TEMP/mac-seed" \
            --expected-digest "$MAC_ARTIFACT_DIGEST"
          python3.12 original-p/scripts/verify_trial_seed.py \
            --seed "$RUNNER_TEMP/mac-seed" --source-sha "$SOURCE_SHA"
          wheel=("$RUNNER_TEMP"/mac-seed/*.whl)
          test "${#wheel[@]}" -eq 1
          wheel_sha="$(python3.12 - "${wheel[0]}" <<'PY'
          import hashlib
          import sys
          print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())
          PY
          )"
          test "$wheel_sha" = "$MAC_WHEEL_SHA"

      - name: Bootstrap fresh diagnostic runtime and install seed wheel
        id: runtime
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3.12 original-p/scripts/bootstrap_trial_conda.py \
            --system darwin --architecture arm64 \
            --prefix "$RUNNER_TEMP/trial-miniforge"
          "$RUNNER_TEMP/trial-miniforge/bin/conda" create \
            --yes --quiet --override-channels --channel conda-forge \
            --prefix "$RUNNER_TEMP/trial-diagnostic" python=3.12 pip
          wheel=("$RUNNER_TEMP"/mac-seed/*.whl)
          test "${#wheel[@]}" -eq 1
          "$RUNNER_TEMP/trial-diagnostic/bin/python" -m pip install \
            --isolated --no-input --only-binary=:all: \
            --disable-pip-version-check --no-cache-dir "${wheel[0]}"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            "$RUNNER_TEMP/trial-diagnostic/bin/python" - \
            "$GITHUB_WORKSPACE/original-p" <<'PY'
          import importlib.util
          import platform
          import sys
          from pathlib import Path
          assert sys.version_info[:2] == (3, 12)
          assert platform.machine() == "arm64"
          module = importlib.util.find_spec("gwexpy_studio")
          assert module is not None and module.origin is not None
          assert not Path(module.origin).resolve().is_relative_to(Path(sys.argv[1]).resolve())
          PY
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            "$RUNNER_TEMP/trial-diagnostic/bin/python" -m pip check
          mkdir -p "$RUNNER_TEMP/diagnostic-output"
          "$RUNNER_TEMP/trial-miniforge/bin/conda" list \
            --json --prefix "$RUNNER_TEMP/trial-diagnostic" \
            > "$RUNNER_TEMP/diagnostic-output/conda-metadata.json"
          "$RUNNER_TEMP/trial-diagnostic/bin/python" -m pip list \
            --format=json > "$RUNNER_TEMP/diagnostic-output/pip-metadata.json"

      - name: Run one bounded native Cocoa NORMAL observer
        id: diagnostic
        if: steps.seed.outcome == 'success' && steps.runtime.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/gate-work"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            "$RUNNER_TEMP/trial-diagnostic/bin/python" \
            scripts/diagnose_trial_gate.py \
            --branch-sha "$BRANCH_SHA" \
            --original-gate-sha "$ORIGINAL_GATE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --wheel-sha "$MAC_WHEEL_SHA" \
            --original-checkout "$GITHUB_WORKSPACE/original-p" \
            --original-gate "$GITHUB_WORKSPACE/original-p/scripts/run_trial_technical_gate.py" \
            --work-root "$RUNNER_TEMP/gate-work" \
            --snapshot "$RUNNER_TEMP/diagnostic-output/diagnostic-snapshot.json" \
            --native-qt
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Fail when Mac setup or observer failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.seed.outcome }}" = success
          test "${{ steps.runtime.outcome }}" = success
          test "${{ steps.diagnostic.outcome }}" = success

      - name: Upload Mac diagnostic snapshot and noncanonical runtime metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trial-gate-diagnostic-macos15-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostic-output/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  diagnose-debian:
    name: Observe Debian 13 NORMAL gate in pinned nonroot container
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact original P separately
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SOURCE_SHA }}
          path: original-p

      - name: Bind source and diagnostic hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-p rev-parse --verify HEAD)" = "$SOURCE_SHA"
          test -z "$(git -C original-p status --porcelain=v1 --untracked-files=all)"
          branch_sha="$(git rev-parse --verify HEAD)"
          gate_sha="$(python3.12 - original-p/scripts/run_trial_technical_gate.py <<'PY'
          import hashlib
          import sys
          print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())
          PY
          )"
          debian_image="$(python3.12 - <<'PY'
          import sys
          sys.path.insert(0, "original-p")
          from scripts.trial_toolchain import debian_container_reference
          print(debian_container_reference())
          PY
          )"
          echo "BRANCH_SHA=$branch_sha" >> "$GITHUB_ENV"
          echo "ORIGINAL_GATE_SHA=$gate_sha" >> "$GITHUB_ENV"
          echo "DEBIAN_IMAGE=$debian_image" >> "$GITHUB_ENV"

      - name: Initialize upload-safe snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic-output"
          python3.12 scripts/diagnose_trial_gate.py \
            --init \
            --branch-sha "$BRANCH_SHA" \
            --original-gate-sha "$ORIGINAL_GATE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --wheel-sha "$DEBIAN_WHEEL_SHA" \
            --original-checkout "$GITHUB_WORKSPACE/original-p" \
            --original-gate "$GITHUB_WORKSPACE/original-p/scripts/run_trial_technical_gate.py" \
            --work-root "$RUNNER_TEMP/gate-work" \
            --snapshot "$RUNNER_TEMP/diagnostic-output/diagnostic-snapshot.json"

      - name: Download and verify exact Debian seed by artifact ID
        id: seed
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${DEBIAN_ARTIFACT_ID}/zip" \
            --output "$RUNNER_TEMP/debian-seed.zip"
          actual="$(python3.12 - "$RUNNER_TEMP/debian-seed.zip" <<'PY'
          import hashlib
          import sys
          digest = hashlib.sha256()
          with open(sys.argv[1], "rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          print("sha256:" + digest.hexdigest())
          PY
          )"
          test "$actual" = "$DEBIAN_ARTIFACT_DIGEST"
          python3.12 original-p/scripts/extract_trial_artifact.py \
            --archive "$RUNNER_TEMP/debian-seed.zip" \
            --output "$RUNNER_TEMP/debian-seed" \
            --expected-digest "$DEBIAN_ARTIFACT_DIGEST"
          python3.12 original-p/scripts/verify_trial_seed.py \
            --seed "$RUNNER_TEMP/debian-seed" --source-sha "$SOURCE_SHA"
          wheel=("$RUNNER_TEMP"/debian-seed/*.whl)
          test "${#wheel[@]}" -eq 1
          wheel_sha="$(python3.12 - "${wheel[0]}" <<'PY'
          import hashlib
          import sys
          print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())
          PY
          )"
          test "$wheel_sha" = "$DEBIAN_WHEEL_SHA"

      - name: Run one bounded Debian diagnostic in the pinned nonroot container
        id: diagnostic
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/diagnostic-output" "$RUNNER_TEMP/debian-state"
          runner_uid="$(id -u)"
          case "$runner_uid" in
            ''|*[!0-9]*) echo "runner UID is not decimal" >&2; exit 1 ;;
          esac
          test "$runner_uid" -gt 0
          docker run --rm --interactive --platform linux/amd64 \
            -e BRANCH_SHA="$BRANCH_SHA" \
            -e ORIGINAL_GATE_SHA="$ORIGINAL_GATE_SHA" \
            -e SOURCE_SHA="$SOURCE_SHA" \
            -e DEBIAN_WHEEL_SHA="$DEBIAN_WHEEL_SHA" \
            -e RUNNER_UID="$runner_uid" \
            -v "$GITHUB_WORKSPACE:/work/repo:ro" \
            -v "$RUNNER_TEMP/debian-seed:/work/seed:ro" \
            -v "$RUNNER_TEMP/diagnostic-output:/work/output" \
            -v "$RUNNER_TEMP/debian-state:/work/state" \
            "$DEBIAN_IMAGE" bash -s <<'CONTAINER'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --no-install-recommends -y \
            bash ca-certificates curl git python3 util-linux \
            libegl1 libgl1 libfontconfig1 libglib2.0-0t64 libdbus-1-3 \
            libxkbcommon0 libzstd1
          useradd --create-home --shell /bin/bash --uid "$RUNNER_UID" trial
          chown -R trial:trial /work/output /work/state
          runuser -u trial -- env \
            HOME=/home/trial PYTHONNOUSERSITE=1 GIT_OPTIONAL_LOCKS=0 \
            RUNNER_UID="$RUNNER_UID" BRANCH_SHA="$BRANCH_SHA" \
            ORIGINAL_GATE_SHA="$ORIGINAL_GATE_SHA" SOURCE_SHA="$SOURCE_SHA" \
            DEBIAN_WHEEL_SHA="$DEBIAN_WHEEL_SHA" /bin/bash -s <<'RUNNER'
          set -euo pipefail
          test "$(id -u)" = "$RUNNER_UID"
          test "$(id -u)" -gt 0
          git config --global --add safe.directory /work/repo/original-p
          /usr/bin/python3 /work/repo/original-p/scripts/bootstrap_trial_conda.py \
            --system linux --architecture x86_64 --prefix /work/state/trial-miniforge
          /work/state/trial-miniforge/bin/conda create --yes --quiet \
            --override-channels --channel conda-forge \
            --prefix /work/state/trial-diagnostic python=3.12 pip
          wheel=(/work/seed/*.whl)
          test "${#wheel[@]}" -eq 1
          /work/state/trial-diagnostic/bin/python -m pip install \
            --isolated --no-input --only-binary=:all: \
            --disable-pip-version-check --no-cache-dir "${wheel[0]}"
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            /work/state/trial-diagnostic/bin/python - \
            /work/repo/original-p <<'PY'
          import importlib.util
          import platform
          import sys
          from pathlib import Path
          assert sys.version_info[:2] == (3, 12)
          assert platform.machine() == "x86_64"
          module = importlib.util.find_spec("gwexpy_studio")
          assert module is not None and module.origin is not None
          assert not Path(module.origin).resolve().is_relative_to(Path(sys.argv[1]).resolve())
          PY
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            /work/state/trial-diagnostic/bin/python -m pip check
          /work/state/trial-miniforge/bin/conda list --json \
            --prefix /work/state/trial-diagnostic > /work/output/conda-metadata.json
          /work/state/trial-diagnostic/bin/python -m pip list --format=json \
            > /work/output/pip-metadata.json
          mkdir -p /work/state/gate
          env -u PYTHONPATH PYTHONNOUSERSITE=1 \
            /work/state/trial-diagnostic/bin/python \
            /work/repo/scripts/diagnose_trial_gate.py \
            --branch-sha "$BRANCH_SHA" \
            --original-gate-sha "$ORIGINAL_GATE_SHA" \
            --source-sha "$SOURCE_SHA" \
            --wheel-sha "$DEBIAN_WHEEL_SHA" \
            --original-checkout /work/repo/original-p \
            --original-gate /work/repo/original-p/scripts/run_trial_technical_gate.py \
            --work-root /work/state/gate \
            --snapshot /work/output/diagnostic-snapshot.json
          RUNNER
          CONTAINER
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Fail when Debian setup or observer failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.seed.outcome }}" = success
          test "${{ steps.diagnostic.outcome }}" = success

      - name: Upload Debian diagnostic snapshot and noncanonical runtime metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trial-gate-diagnostic-debian13-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/diagnostic-output/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false
